name: agent-project-lab
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_lab
      POSTGRES_USER: project_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated hexadecimal password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_lab -d project_lab"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://project_lab:${POSTGRES_PASSWORD}@db:5432/project_lab
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: 4317
    ports:
      - "127.0.0.1:14317:4317"
    volumes:
      - project-files:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
volumes:
  postgres-data:
  project-files:
