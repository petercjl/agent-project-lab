name: agent-project-lab
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_lab
      POSTGRES_USER: project_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated hexadecimal password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_lab -d project_lab"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      APP_COMMIT: ${APP_COMMIT:-unknown}
      DATABASE_URL: postgresql://project_lab:${POSTGRES_PASSWORD}@db:5432/project_lab
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: 4317
      APP_ENV: ${APP_ENV:-production}
      INSTANCE_ID: ${INSTANCE_ID:-nas-production}
      AUTH_MODE: ${AUTH_MODE:-dingtalk}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:?Set DingTalk Client ID}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:?Set DingTalk Client Secret}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:?Set DingTalk Corp ID}
      DINGTALK_REDIRECT_URI: ${DINGTALK_REDIRECT_URI:?Set DingTalk redirect URI}
      DINGTALK_BOOTSTRAP_FIRST_ADMIN: ${DINGTALK_BOOTSTRAP_FIRST_ADMIN:-false}
      DINGTALK_ADMIN_UNION_ID: ${DINGTALK_ADMIN_UNION_ID:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:14317:4317"
    volumes:
      - project-files:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 512m
volumes:
  postgres-data:
  project-files:
